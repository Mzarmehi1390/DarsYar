name: Native Android CI

concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - feat/native-android-rebuild
    paths:
      - 'android/**'
      - '.github/workflows/android-native-ci.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    # Linux hosted runners provide KVM-backed x86_64 emulation; this avoids
    # the extremely slow/offline emulator boot observed on the macOS runner.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Accept Android SDK licenses and install packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          # sdkmanager exits after accepting all licenses; with pipefail, the
          # expected SIGPIPE from `yes` would otherwise fail this step.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Build, test and lint native Android project
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug test lint

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          # GitHub-hosted Ubuntu images may ship with KVM modules available
          # but not loaded. Load the host and CPU-specific modules explicitly.
          sudo modprobe kvm || true
          if grep -q GenuineIntel /proc/cpuinfo; then
            sudo modprobe kvm_intel || true
          elif grep -q AuthenticAMD /proc/cpuinfo; then
            sudo modprobe kvm_amd || true
          fi
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          else
            echo "KVM device was not created after loading available modules."
            echo "CPU: $(grep -m1 'model name' /proc/cpuinfo || true)"
            lsmod | grep -E '^kvm' || true
            ls -la /dev/kvm /dev 2>&1 | head -n 40
            exit 1
          fi
          test -r /dev/kvm
          test -w /dev/kvm
          ls -l /dev/kvm

      - name: Verify process-death recovery on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-linux-hw-accel: false
          # The action executes from the repository root; the Gradle build lives in android/.
          script: gradle --no-daemon --stacktrace -p android :macrobenchmark:connectedCheck

      - name: Upload emulator test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darsyar-emulator-test-diagnostics
          path: |
            android/macrobenchmark/build/reports/androidTests/connected/debug/**
            android/macrobenchmark/build/outputs/androidTest-results/connected/debug/**
            android/macrobenchmark/build/outputs/logs/**
          if-no-files-found: warn

      - name: Verify Room schema export
        working-directory: android
        run: |
          mapfile -t schemas < <(find core/database/schemas -type f -name '*.json' -print)
          if [ "${#schemas[@]}" -eq 0 ]; then
            echo "Room did not export any schema snapshots."
            exit 1
          fi
          printf 'Exported Room schemas:\n%s\n' "${schemas[@]}"

      - name: Verify committed Room schema snapshots
        working-directory: android
        run: |
          schema="core/database/schemas/com.mzarmehi1390.darsyar.core.database.DarsYarDatabase/2.json"
          git ls-files --error-unmatch "$schema" >/dev/null
          git diff --exit-code -- core/database/schemas

      - name: Upload Room schema snapshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: darsyar-room-schemas
          path: android/core/database/schemas/**/*.json
          if-no-files-found: error

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: darsyar-native-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
