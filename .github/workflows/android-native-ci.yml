name: Native Android CI

on:
  push:
    branches:
      - feat/native-android-rebuild
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0" "platform-tools"

      - name: Build, test and lint native Android project
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug test lint

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: darsyar-native-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
