name: One-time branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-branch-cleanup.yml

permissions:
  contents: write

jobs:
  delete-non-main-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            [ "$branch" = "main" ] && continue
            encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "heads/$branch")"
            echo "Deleting branch: $branch"
            if ! gh api --method DELETE "repos/$REPOSITORY/git/refs/$encoded"; then
              echo "::error::Could not delete branch: $branch"
              failed=1
            fi
          done < <(gh api --paginate "repos/$REPOSITORY/branches" --jq '.[].name')
          exit "$failed"
