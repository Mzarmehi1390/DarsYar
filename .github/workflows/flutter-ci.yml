name: Flutter CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android app icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      # No private upload keystore is used. Gradle's release build type is
      # configured to fall back to the standard Android debug certificate.
      - name: Confirm debug-signing mode
        run: |
          if [[ -f android/key.properties ]]; then
            echo "::error::Unexpected private signing configuration found in CI workspace."
            exit 1
          fi
          echo "Building test artifacts with the standard Android debug certificate."

      - name: Build Android APK release
        run: flutter build apk --release

      - name: Build Android App Bundle release
        run: flutter build appbundle --release

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: darsyar-android-debug-signed-test
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
