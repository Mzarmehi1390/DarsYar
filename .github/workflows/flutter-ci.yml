name: Flutter CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/darsyar-foundation
      - feat/darsyar-ux-refinement
      - release/android-signing-ci
      - feature/multiweek-planner
      - refactor/modularize-app
  pull_request:
    branches:
      - main

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate platform app icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        # Keep infos visible without failing CI; warnings and errors remain fatal.
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      # Forked pull requests do not receive repository secrets. They may still
      # validate compilation with the Gradle debug-signing fallback.
      - name: Configure Android release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASS: ${{ secrets.STORE_PASS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64}" || -z "${KEY_ALIAS}" || -z "${KEY_PASSWORD}" || -z "${STORE_PASS}" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
              echo "::error::Android release signing secrets are required for push and manual release-validation runs."
              exit 1
            fi
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are unavailable to this pull request; using debug signing for compile validation only."
            exit 0
          fi

          echo "signed=true" >> "$GITHUB_OUTPUT"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > android/app/darsyar-upload-key.jks
          cat > android/key.properties <<EOF
          storePassword=${STORE_PASS}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=app/darsyar-upload-key.jks
          EOF

      - name: Build Android APK release
        run: flutter build apk --release

      - name: Build Android App Bundle release
        run: flutter build appbundle --release

      - name: Verify Android release signatures
        if: steps.signing.outputs.signed == 'true'
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          jarsigner -verify -verbose -certs build/app/outputs/bundle/release/app-release.aab

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: darsyar-android-ci-validation
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

  ios-build-validation:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate platform app icons
        run: dart run flutter_launcher_icons

      # Compile the iOS app for the simulator without Apple signing credentials.
      # Simulator output is for validation only, not an installable device IPA.
      - name: Build iOS release (no code signing)
        run: flutter build ios --simulator

      - name: Upload iOS build validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: darsyar-ios-build-validation
          path: build/ios/iphonesimulator/Runner.app
          if-no-files-found: error
