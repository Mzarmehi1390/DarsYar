name: dars_yar
description: "Persian-first study planner and exam answer sheet."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  liquid_glass_widgets: ^1.16.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/darsyar_launcher.png
  remove_alpha_ios: true
  adaptive_icon_background: "#062019"
  adaptive_icon_foreground: assets/branding/darsyar_launcher.png
  web:
    generate: true
    image_path: assets/branding/darsyar_launcher.png
    background_color: "#062019"
    theme_color: "#062019"
  windows:
    generate: true
    image_path: assets/branding/darsyar_launcher.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/branding/darsyar_launcher.png
